<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proyecto Hail Mary - Línea de Petrova</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#030000;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:20px;color:rgba(255,120,110,.8);text-shadow:0 0 10px rgba(255,0,0,.5);pointer-events:none}
#ui h1{margin:0;font-size:22px;letter-spacing:.2em;text-transform:uppercase}
#ui p{margin:4px 0 0;font:12px ui-monospace,monospace;opacity:.75}

/* --- Nuevos estilos para la pantalla interactiva --- */
#pantalla-interactiva {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none; /* Permite que los clics pasen al cometa */
  z-index: 10;
}

#mensaje-toca {
  font-size: 24px;
  color: rgba(255, 200, 200, 0.9);
  letter-spacing: 3px;
  text-shadow: 0 0 15px rgba(255, 100, 100, 0.8);
  animation: latido 1.5s infinite alternate;
  transition: opacity 0.5s ease;
}

@keyframes latido {
  from { opacity: 0.4; }
  to { opacity: 1; }
}

#mensaje-cumple {
  position: absolute;
  text-align: center;
  opacity: 0; /* Oculto al inicio */
  transition: opacity 2.5s ease-in-out; /* Aparición lenta y suave */
}

#mensaje-cumple h1 {
  margin: 0;
  font-size: 8vw; /* Se adapta al tamaño de la pantalla */
  color: rgba(255, 255, 255, 0.25); /* Semitransparente */
  text-transform: uppercase;
  letter-spacing: 5px;
  text-shadow: 0 0 25px rgba(255, 50, 50, 0.4);
}

#mensaje-cumple p {
  margin: 10px 0 0 0;
  font-size: 3vw; /* Letra más chica */
  color: rgba(255, 200, 200, 0.4);
  letter-spacing: 4px;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Sistema Tau Ceti</h1>
  <p>Misión Hail Mary // Observación de Astrófagos</p>
  <p>◉ Arrastra el cometa</p>
</div>

<!-- Nuevos elementos de texto -->
<div id="pantalla-interactiva">
  <div id="mensaje-toca">Toca la pantalla Abbey</div>
  <div id="mensaje-cumple">
    <h1>Happy birthday Abbey!!</h1>
    <p>Feliz cumpleaños</p>
  </div>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
let W,H,time=0;
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a);
function sprite(n,stops){const c=document.createElement('canvas');c.width=c.height=n;const g=c.getContext('2d'),r=g.createRadialGradient(n/2,n/2,0,n/2,n/2,n/2);stops.forEach(s=>r.addColorStop(s[0],s[1]));g.fillStyle=r;g.fillRect(0,0,n,n);return c}
const glow=sprite(128,[[0,'rgba(255,255,255,1)'],[.15,'rgba(255,90,70,.85)'],[.5,'rgba(255,20,20,.25)'],[1,'rgba(255,0,0,0)']]);
const soft=sprite(128,[[0,'rgba(255,120,100,.9)'],[1,'rgba(255,0,0,0)']]);
const mkBokeh=(r,g,b)=>sprite(128,[[0,`rgba(${r},${g},${b},.5)`],[.72,`rgba(${r},${g},${b},.65)`],[.9,`rgba(255,${g+50},${b+40},1)`],[1,`rgba(${r},${g},${b},0)`]]);
const bokehs=[mkBokeh(255,70,50),mkBokeh(255,120,60),mkBokeh(230,50,90)];

// ---------- entidades ----------
let stars=[],astros=[],orbs=[],motes=[],tailP=[],panels=[];
const C={fx:.3,fy:.4,x:0,y:0,drag:false,hover:false};
const S={};
let seed=7;const sr=()=>(seed=seed*16807%2147483647)/2147483647;
for(let i=0;i<70;i++)panels.push({x:-145+sr()*500,y:-56+sr()*105,w:18+sr()*34,h:10+sr()*20,a:sr()*.08-.02});

function init(){
  stars=Array.from({length:400},()=>({x:rnd(0,W),y:rnd(0,H),s:Math.random()*1.5,v:rnd(.05,.25)}));
  astros=Array.from({length:200},(_,i)=>{const f=i>=150;return{x:rnd(0,W),y:rnd(0,H),s:f?rnd(2,5):rnd(.5,2),vx:rnd(-.25,.25)-(f?.5:.2),vy:rnd(-.25,.25),ph:rnd(0,TAU),f}});
  orbs=Array.from({length:18},(_,i)=>({x:rnd(0,W),y:rnd(0,H),r:i<12?rnd(40,150):rnd(12,30),a:i<12?rnd(.04,.1):rnd(.08,.16),vx:rnd(-.15,.15),vy:rnd(-.1,.1),ph:rnd(0,TAU),k:i%3,fg:i%2==0}));
  motes=Array.from({length:80},()=>({u:Math.random(),v:rnd(-1,1),sp:rnd(.0006,.002),sz:rnd(5,14),ph:rnd(0,TAU)}));
}
function resize(){
  const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  S.s=Math.max(.6,Math.min(W/1400,H/850,1.3));S.a=-.42;S.x=W*.06;S.y=H*.97;
  if(!C.x){C.x=C.fx*W;C.y=C.fy*H}
  init();
}
const shipPt=(lx,ly)=>{const c=Math.cos(S.a),n=Math.sin(S.a);return{x:S.x+(lx*c-ly*n)*S.s,y:S.y+(lx*n+ly*c)*S.s}};
const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r)};
const spr=(img,x,y,r,a)=>{ctx.globalAlpha=a;ctx.drawImage(img,x-r,y-r,r*2,r*2);ctx.globalAlpha=1};

// ---------- interacción del cometa ----------
cv.addEventListener('pointerdown',e=>{if(Math.hypot(e.clientX-C.x,e.clientY-C.y)<90){C.drag=true;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'}});
cv.addEventListener('pointermove',e=>{
  if(C.drag){C.fx=e.clientX/W;C.fy=e.clientY/H}
  else{C.hover=Math.hypot(e.clientX-C.x,e.clientY-C.y)<90;cv.style.cursor=C.hover?'grab':'default'}
});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{C.drag=false;cv.style.cursor=C.hover?'grab':'default'}));

// ---------- fondo ----------
function drawBg(){
  const g=ctx.createRadialGradient(W*.7,H*.3,0,W*.7,H*.3,W);
  g.addColorStop(0,'#2a0005');g.addColorStop(.5,'#0a0002');g.addColorStop(1,'#030000');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){
    s.x-=s.v;if(s.x<0)s.x=W;
    ctx.fillStyle=`rgba(255,90,90,${(.5+Math.sin(time*.005+s.x)*.5)*.8})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,TAU);ctx.fill();
  }
}
function drawAstros(fg){
  ctx.globalCompositeOperation='screen';
  for(const a of astros){
    if(a.f!==fg)continue;
    a.x+=a.vx;a.y+=a.vy+Math.sin(time*.002+a.ph)*.2;
    if(a.x<-10)a.x=W+10;if(a.x>W+10)a.x=-10;if(a.y<-10)a.y=H+10;if(a.y>H+10)a.y=-10;
    spr(glow,a.x,a.y,a.s*3,.7+Math.sin(time*.003+a.ph)*.3);
  }
  ctx.globalCompositeOperation='source-over';
}
function drawOrbs(fg){
  ctx.globalCompositeOperation='screen';
  for(const o of orbs){
    if(o.fg!==fg)continue;
    o.x+=o.vx;o.y+=o.vy;
    if(o.x<-o.r)o.x=W+o.r;if(o.x>W+o.r)o.x=-o.r;if(o.y<-o.r)o.y=H+o.r;if(o.y>H+o.r)o.y=-o.r;
    spr(bokehs[o.k],o.x,o.y,o.r,o.a*(.8+.2*Math.sin(time*.001+o.ph)));
  }
  ctx.globalCompositeOperation='source-over';
}

// ---------- cometa (arrastrable) ----------
function drawComet(){
  C.x+=(C.fx*W-C.x)*.18;C.y+=(C.fy*H-C.y)*.18;
  const hx=C.x+Math.sin(time*.0006)*5,hy=C.y+Math.cos(time*.0007)*5;
  let dx=W*1.15-hx,dy=-H*.2-hy;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
  const nx=-dy,ny=dx,len=Math.hypot(W,H)*.9,ex=hx+dx*len,ey=hy+dy*len;
  const bend=70+Math.sin(time*.0005)*35;
  const cx=hx+dx*len*.5+nx*bend,cy=hy+dy*len*.5+ny*bend;
  ctx.save();ctx.globalCompositeOperation='screen';ctx.lineCap='round';
  for(const[w,a]of[[46,.05],[20,.1],[8,.22],[2.5,.65]]){
    const g=ctx.createLinearGradient(hx,hy,ex,ey);
    g.addColorStop(0,`rgba(255,150,130,${a})`);g.addColorStop(.5,`rgba(255,40,40,${a*.4})`);g.addColorStop(1,'rgba(255,0,0,0)');
    ctx.strokeStyle=g;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(hx,hy);ctx.quadraticCurveTo(cx,cy,ex,ey);ctx.stroke();
  }
  for(let i=0;i<3&&tailP.length<450;i++){const v=rnd(1.5,4.5);tailP.push({x:hx+rnd(-6,6),y:hy+rnd(-6,6),vx:dx*v+nx*rnd(-.7,.7),vy:dy*v+ny*rnd(-.7,.7),l:1,s:rnd(8,26)})}
  tailP=tailP.filter(p=>p.l>0);
  for(const p of tailP){p.x+=p.vx;p.y+=p.vy;p.l-=.012;spr(soft,p.x,p.y,p.s*(2.2-p.l),p.l*.3)}
  spr(glow,hx,hy,150,.8);
  spr(glow,hx,hy,32,1);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hx,hy,6,0,TAU);ctx.fill();
  const fl=ctx.createLinearGradient(hx-110,hy,hx+110,hy);fl.addColorStop(0,'rgba(255,120,100,0)');fl.addColorStop(.5,'rgba(255,220,210,.5)');fl.addColorStop(1,'rgba(255,120,100,0)');
  ctx.fillStyle=fl;ctx.fillRect(hx-110,hy-.6,220,1.2);
  if(C.hover||C.drag){ctx.strokeStyle='rgba(255,220,210,.35)';ctx.setLineDash([6,8]);ctx.lineDashOffset=-time*.02;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(hx,hy,52,0,TAU);ctx.stroke()}
  ctx.restore();
}

// ---------- Música y Mensajes ----------

const musica = new Audio('cancion1.mp3');
// ¡Ojo! Ya no está aquí el currentTime

const msgToca = document.getElementById('mensaje-toca');
const msgCumple = document.getElementById('mensaje-cumple');

// Iniciar la música y animaciones al hacer el primer clic
window.addEventListener('pointerdown', () => {
  if (musica.paused) {
    musica.play().catch(e => console.log("Esperando interacción..."));

    // 1. Empezar a desvanecer "Toca la pantalla Abbey"
    msgToca.style.opacity = '0';

    // 2. Esperar medio segundo (500ms) a que se desvanezca por completo
    setTimeout(() => {
      msgToca.remove(); // ¡BOOM! Desaparece por completo del código

      // 3. Mostrar el mensaje de Feliz Cumpleaños
      msgCumple.style.opacity = '1';
    }, 500);
  }
}, { once: true });

// ---------- nave ----------
function drawShip(){
  ctx.save();ctx.translate(S.x,S.y);ctx.rotate(S.a);ctx.scale(S.s,S.s);
  
  // radiadores (paneles laterales)
  for(const sg of[-1,1]){
    ctx.save();ctx.scale(1,sg);
    const g=ctx.createLinearGradient(0,-62,0,-125);g.addColorStop(0,'#3a1717');g.addColorStop(1,'#0e0505');
    ctx.fillStyle=g;ctx.strokeStyle='#6a2c2a';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-140,-62);ctx.lineTo(-105,-125);ctx.lineTo(-10,-125);ctx.lineTo(-30,-62);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.strokeStyle='rgba(255,120,100,.15)';ctx.lineWidth=1;
    for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(-140+i*20,-62);ctx.lineTo(-105+i*19,-125);ctx.stroke()}
    ctx.restore();
  }
  
  // tobera (motores traseros - ahora más angulares)
  const eg=ctx.createLinearGradient(-235,0,-150,0);eg.addColorStop(0,'#1a0808');eg.addColorStop(1,'#4a2020');
  ctx.fillStyle=eg;ctx.strokeStyle='#7a3430';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-150,-46);ctx.lineTo(-218,-72);ctx.lineTo(-240,-40);ctx.lineTo(-240,40);ctx.lineTo(-218,72);ctx.lineTo(-150,46);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.globalCompositeOperation='screen';spr(glow,-228,0,80,.55+Math.sin(time*.004)*.1);ctx.globalCompositeOperation='source-over';
  
  // casco (cuerpo principal - esquinas más cuadradas)
  const hg=ctx.createLinearGradient(0,-80,0,62);
  [[0,'#8a403a'],[.12,'#4e2120'],[.5,'#251010'],[.85,'#0f0606'],[1,'#050202']].forEach(s=>hg.addColorStop(s[0],s[1]));
  ctx.fillStyle=hg;
  rr(-150,-62,520,124,4); // Radio reducido a 4 para quitar lo redondeado
  ctx.fill();
  ctx.save();rr(-150,-62,520,124,4);ctx.clip();
  
  for(let x=-110;x<370;x+=65){ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,-62);ctx.lineTo(x,62);ctx.stroke();ctx.strokeStyle='rgba(255,120,100,.18)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+2,-62);ctx.lineTo(x+2,62);ctx.stroke()}
  for(const p of panels){ctx.fillStyle=p.a>0?`rgba(255,160,140,${p.a})`:`rgba(0,0,0,${-p.a*6})`;ctx.fillRect(p.x,p.y,p.w,p.h);ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=1;ctx.strokeRect(p.x,p.y,p.w,p.h)}
  ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=2;[-30,0,30].forEach(y=>{ctx.beginPath();ctx.moveTo(-150,y);ctx.lineTo(370,y);ctx.stroke()});
  const sp=ctx.createLinearGradient(-150,0,370,0);sp.addColorStop(0,'rgba(255,140,120,0)');sp.addColorStop(.5,'rgba(255,140,120,.3)');sp.addColorStop(1,'rgba(255,140,120,.1)');
  ctx.fillStyle=sp;ctx.fillRect(-150,-62,520,9);
  ctx.globalCompositeOperation='screen';spr(soft,210,-62,150,.4);ctx.globalCompositeOperation='source-over';
  ctx.font='700 20px ui-monospace,monospace';ctx.fillStyle='rgba(230,150,140,.45)';ctx.fillText('HAIL MARY',-100,8);
  ctx.font='700 10px ui-monospace,monospace';ctx.fillText('RM-01  ·  TAU CETI',-100,26);
  ctx.restore();
  ctx.strokeStyle='#7a3430';ctx.lineWidth=1.5;rr(-150,-62,520,124,4);ctx.stroke();
  
  // Módulos centrales (reemplaza al bulto redondo para verse más industrial)
  ctx.fillStyle='#2a1212';ctx.strokeStyle='#8a3a36';
  ctx.fillRect(80,-70,40,140); ctx.strokeRect(80,-70,40,140);
  ctx.fillRect(130,-68,20,136); ctx.strokeRect(130,-68,20,136);
  
  // Proa (la punta de la nave - ahora geométrica y afilada en lugar de redonda)
  const ng=ctx.createLinearGradient(0,-62,0,62);ng.addColorStop(0,'#7a3a36');ng.addColorStop(.4,'#2a1212');ng.addColorStop(1,'#060202');
  ctx.fillStyle=ng;
  ctx.beginPath();
  ctx.moveTo(370,-62);
  ctx.lineTo(440,-45);
  ctx.lineTo(485,-15);
  ctx.lineTo(485,15);
  ctx.lineTo(440,45);
  ctx.lineTo(370,62);
  ctx.closePath();
  ctx.fill();ctx.stroke();
  
  // Ventana de la cabina (forma de trapecio)
  ctx.fillStyle='#080202';ctx.strokeStyle='#8a3a36';
  ctx.beginPath(); ctx.moveTo(400,-25); ctx.lineTo(450,-15); ctx.lineTo(450,15); ctx.lineTo(400,25); ctx.closePath();
  ctx.fill();ctx.stroke();
  
  const wg=ctx.createLinearGradient(400,-25,450,0);wg.addColorStop(0,'rgba(255,170,150,.55)');wg.addColorStop(.4,'rgba(255,60,50,.12)');wg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=wg;
  ctx.beginPath(); ctx.moveTo(402,-22); ctx.lineTo(448,-13); ctx.lineTo(448,13); ctx.lineTo(402,22); ctx.closePath();
  ctx.fill();
  for(let i=0;i<3;i++){ctx.fillStyle=`rgba(255,80,70,${.5+.5*Math.sin(time*.004+i*1.7)})`;ctx.beginPath();ctx.arc(415+i*12,-9,2,0,TAU);ctx.fill()}
  
  // antena
  ctx.strokeStyle='#7a3430';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-20,-62);ctx.lineTo(-20,-102);ctx.stroke();
  ctx.fillStyle='#3a1818';ctx.beginPath();ctx.ellipse(-20,-106,28,8,-.3,0,TAU);ctx.fill();ctx.stroke();
  
  // escotilla y base del proyector (se mantienen igual para que no se rompa el cable del astronauta)
  ctx.fillStyle='#241010';ctx.strokeStyle='#9a463f';ctx.lineWidth=1.5;rr(325,-72,30,14,3);ctx.fill();ctx.stroke();
  ctx.fillStyle='#2a1313';rr(193,-70,34,10,3);ctx.fill();ctx.stroke();
  
  // luces de navegación
  ctx.globalCompositeOperation='screen';
  const bl=Math.sin(time*.005)>0?1:.15;
  spr(glow,-150,-62,16,bl);spr(glow,485,0,14,1-bl*.8);
  ctx.restore();
}
function drawProjector(ax,ay){
  const b=shipPt(210,-64),ang=Math.atan2(ay-b.y,ax-b.x),s=S.s,L=62*s;
  ctx.save();ctx.translate(b.x,b.y);
  ctx.fillStyle='#2a1313';ctx.strokeStyle='#9a463f';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,16*s,0,TAU);ctx.fill();ctx.stroke();
  ctx.rotate(ang);
  const g=ctx.createLinearGradient(0,-12*s,0,12*s);g.addColorStop(0,'#a05048');g.addColorStop(.4,'#3a1a1a');g.addColorStop(1,'#0e0505');
  ctx.fillStyle=g;rr(-8*s,-11*s,L,22*s,5*s);ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.5)';for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(i*12*s-8*s,-11*s);ctx.lineTo(i*12*s-8*s,11*s);ctx.stroke()}
  ctx.fillStyle='#1a0a0a';ctx.strokeStyle='#b0524a';rr(L-12*s,-16*s,15*s,32*s,4*s);ctx.fill();ctx.stroke();
  ctx.restore();
  return{x:b.x+Math.cos(ang)*(L+2*s),y:b.y+Math.sin(ang)*(L+2*s),a:ang};
}
function drawBeam(P,tx,ty){
  const dist=Math.hypot(tx-P.x,ty-P.y),len=dist*1.3,half=Math.atan2(110*S.s,dist),ca=Math.cos(P.a),sa=Math.sin(P.a);
  ctx.save();ctx.globalCompositeOperation='screen';
  for(const[k,a]of[[1,.14],[.55,.2],[.25,.3]]){
    const h=half*k,g=ctx.createLinearGradient(P.x,P.y,P.x+ca*len,P.y+sa*len);
    g.addColorStop(0,`rgba(255,160,140,${a})`);g.addColorStop(.6,`rgba(255,60,50,${a*.45})`);g.addColorStop(1,'rgba(255,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(P.x+Math.cos(P.a-h)*len,P.y+Math.sin(P.a-h)*len);ctx.lineTo(P.x+Math.cos(P.a+h)*len,P.y+Math.sin(P.a+h)*len);ctx.closePath();ctx.fill();
  }
  for(const m of motes){
    m.u+=m.sp;if(m.u>1)m.u=0;
    const al=m.u*len,lat=m.v*Math.tan(half)*al;
    spr(soft,P.x+ca*al-sa*lat,P.y+sa*al+ca*lat,m.sz*S.s*(.5+m.u),(1-m.u)*(.25+.25*Math.sin(time*.003+m.ph)));
  }
  spr(glow,P.x,P.y,45*S.s,1);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(P.x,P.y,5*S.s,0,TAU);ctx.fill();
  ctx.restore();
}
function drawTether(ax,ay){
  const A=shipPt(340,-72),mx=(A.x+ax)/2,my=(A.y+ay)/2;
  const cx=mx+Math.sin(time*.0012)*40,cy=my+70*S.s+Math.cos(time*.0009)*30;
  ctx.save();ctx.lineCap='round';
  for(const[c,w]of[['#3a1616',4.5],['#c0605a',1.8],['rgba(255,210,200,.5)',.6]]){
    ctx.strokeStyle=c;ctx.lineWidth=w*S.s;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.quadraticCurveTo(cx,cy,ax,ay);ctx.stroke();
  }
  ctx.restore();
}

// ---------- astronauta ----------
function drawAstronaut(x,y,rot,lens){
  const k=S.s*1.15;
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(k,k);
  const loc=(vx,vy)=>{const d=Math.hypot(vx,vy)||1;vx/=d;vy/=d;const c=Math.cos(-rot),s=Math.sin(-rot);return[vx*c-vy*s,vx*s+vy*c]};
  const[Lx,Ly]=loc(lens.x-x,lens.y-y),[Rx,Ry]=loc(C.x-x,C.y-y);
  const LO='#1d0b0b',BA='#8c6a66',HI='#f0b8ae';
  const lit=(cx,cy,w,lo,ba,hi)=>{const g=ctx.createLinearGradient(cx-Lx*w,cy-Ly*w,cx+Lx*w,cy+Ly*w);g.addColorStop(0,lo);g.addColorStop(.5,ba);g.addColorStop(1,hi);return g};
  const rim=(cx,cy,w)=>{const g=ctx.createLinearGradient(cx-Rx*w,cy-Ry*w,cx+Rx*w,cy+Ry*w);g.addColorStop(0,'rgba(255,150,130,0)');g.addColorStop(.7,'rgba(255,150,130,0)');g.addColorStop(1,'rgba(255,170,150,.9)');return g};
  const limb=(p,w,lo,ba,hi)=>{
    ctx.lineCap='round';ctx.lineJoin='round';
    const path=(ox,oy)=>{ctx.beginPath();ctx.moveTo(p[0][0]+ox,p[0][1]+oy);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0]+ox,p[i][1]+oy)};
    path(0,0);ctx.strokeStyle=lo;ctx.lineWidth=w;ctx.stroke();
    path(Lx*w*.1,Ly*w*.1);ctx.strokeStyle=ba;ctx.lineWidth=w*.74;ctx.stroke();
    path(Lx*w*.2,Ly*w*.2);ctx.strokeStyle=hi;ctx.lineWidth=w*.28;ctx.stroke();
    const j=p[1];ctx.fillStyle=lo;ctx.beginPath();ctx.arc(j[0],j[1],w*.52,0,TAU);ctx.fill();
    ctx.fillStyle=ba;ctx.beginPath();ctx.arc(j[0]+Lx*w*.08,j[1]+Ly*w*.08,w*.4,0,TAU);ctx.fill();
    const e=p[p.length-1];ctx.fillStyle=lit(e[0],e[1],w,'#120606','#4a2a2a','#a06a62');ctx.beginPath();ctx.arc(e[0],e[1],w*.68,0,TAU);ctx.fill();
  };
  const a=Math.sin(time*.0022),b=Math.cos(time*.0017);
  // mochila
  ctx.fillStyle=lit(-36,2,50,'#0d0505','#3d2626','#a06a62');ctx.strokeStyle='#1a0a0a';ctx.lineWidth=2;
  rr(-56,-46,38,96,10);ctx.fill();ctx.stroke();
  rr(-64,-30,10,60,5);ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.moveTo(-44,-40);ctx.lineTo(-44,44);ctx.moveTo(-30,-40);ctx.lineTo(-30,44);ctx.stroke();
  // pierna y brazo lejanos
  limb([[-8,36],[-24,76+a*8],[-14,114+a*12]],17,'#0e0505','#4e302e','#9a6a62');
  limb([[-14,-30],[-38,-8+b*8],[-52,20+b*12]],14,'#0e0505','#4e302e','#9a6a62');
  // torso
  ctx.fillStyle=lit(0,0,48,LO,BA,HI);rr(-26,-46,54,90,20);ctx.fill();
  ctx.strokeStyle=rim(0,0,46);ctx.lineWidth=2.5;ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,.35)';rr(-26,28,54,10,5);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(-26,-8,54,5);
  ctx.fillStyle='#1a0909';ctx.strokeStyle='#6a3330';ctx.lineWidth=1.2;rr(-4,-28,24,20,4);ctx.fill();ctx.stroke();
  ctx.fillStyle=`rgba(255,70,60,${.5+.5*Math.sin(time*.006)})`;ctx.beginPath();ctx.arc(2,-21,2.2,0,TAU);ctx.fill();
  ctx.fillStyle='#ffb347';ctx.beginPath();ctx.arc(9,-21,2.2,0,TAU);ctx.fill();
  ctx.fillStyle='#fff';ctx.globalAlpha=.7;ctx.fillRect(0,-14,16,2);ctx.globalAlpha=1;
  // pierna y brazo cercanos
  limb([[10,36],[30,72+b*8],[24,110+b*12]],18,LO,BA,HI);
  limb([[16,-30],[46,-14+b*8],[62,14+b*12]],15,LO,BA,HI);
  // cuello y casco
  ctx.fillStyle=lit(2,-46,24,LO,'#5a3a38',HI);ctx.beginPath();ctx.ellipse(2,-46,22,7,0,0,TAU);ctx.fill();
  ctx.fillStyle=lit(4,-70,28,LO,BA,HI);ctx.beginPath();ctx.arc(4,-70,27,0,TAU);ctx.fill();
  ctx.strokeStyle=rim(4,-70,27);ctx.lineWidth=2.5;ctx.stroke();
  ctx.fillStyle='#2a1212';rr(-24,-74,8,16,3);ctx.fill();
  ctx.save();ctx.translate(10,-70);ctx.rotate(.12);
  const vg=ctx.createRadialGradient(Rx*6,Ry*6,1,0,0,24);
  [[0,'#ffe0d6'],[.18,'#e0584a'],[.5,'#4a1210'],[1,'#0b0303']].forEach(s=>vg.addColorStop(s[0],s[1]));
  ctx.fillStyle=vg;ctx.strokeStyle='#1a0808';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,18,21,0,0,TAU);ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,14,-2.3,-1.2);ctx.stroke();
  ctx.globalCompositeOperation='screen';spr(glow,Rx*9,Ry*9,7,.9);
  ctx.restore();
  ctx.restore();
}

// ---------- bucle ----------
function animate(t){
  time=t;
  drawBg();
  drawAstros(false);drawOrbs(false);
  drawComet();
  const ax=W*.6+Math.sin(t*.001)*40,ay=H*.4+Math.cos(t*.0008)*60,rot=Math.sin(t*.0005)*.15-.2;
  drawShip();
  const P=drawProjector(ax,ay);
  drawBeam(P,ax,ay);
  drawTether(ax+8,ay+14);
  drawAstronaut(ax,ay,rot,P);
  drawAstros(true);drawOrbs(true);
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.hypot(W,H)*.62);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.65)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  requestAnimationFrame(animate);
}
addEventListener('resize',resize);
resize();
requestAnimationFrame(animate);
</script>
</body>
